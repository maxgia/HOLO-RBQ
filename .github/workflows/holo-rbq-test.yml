name: Collaudo HOLO RBQ
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressione:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "HOLO RBQ/codice-sorgente"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/chat.test.cjs
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s e2e -v
