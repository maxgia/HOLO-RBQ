name: Collaudo HOLO RBQ
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressione:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "HOLO RBQ/codice-sorgente"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/chat.test.cjs
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s e2e -v

  avvio-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collaudo avvio PowerShell 5.1
        shell: powershell
        run: python "HOLO RBQ/codice-sorgente/tests/windows_launcher_smoke.py"

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_USER: holo_test
          POSTGRES_PASSWORD: holo-ci-only
          POSTGRES_DB: holo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holo_test -d holo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOLO_TEST_DATABASE_URL: postgresql+psycopg://holo_test:holo-ci-only@127.0.0.1:5432/holo_test
    defaults:
      run:
        working-directory: "HOLO RBQ/codice-sorgente"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s e2e -v

      - name: Suite funzionale originale su PostgreSQL
        run: python tests/run_postgres_regression.py
      - name: Report regressione PostgreSQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-regression-results
          path: HOLO RBQ/codice-sorgente/postgres-regression-results.json
          if-no-files-found: error

      - name: Anteprime interfaccia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screenshots
          path: HOLO RBQ/codice-sorgente/ux-screenshots
          if-no-files-found: warn
